[project]
name = "mcp-libre"
version = "0.1.0"
description = "LibreOffice Model Context Protocol Server - Provides tools and resources for interacting with LibreOffice documents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LibreOffice MCP Server Project"},
]
keywords = ["mcp", "libreoffice", "document", "processing", "ai", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    # <2 on purpose: mcp 2.0 removed mcp.server.fastmcp (it became
    # mcp.server.mcpserver) and this server is built on FastMCP. Docker installs
    # with pip, which ignores uv.lock, so the ceiling has to live here.
    "mcp[cli]>=1.10.1,<2",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-libre = "src.libremcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Replicates the client-side structured-output validation, including
    # `format: date-time` checking. See tests/test_output_schema.py.
    "jsonschema>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
