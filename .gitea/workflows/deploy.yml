name: Deploy to NAS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: mcp-nas-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Copy env from live deployment
        run: cp /volume1/docker/mcp-libre/.env .env 2>/dev/null || true

      - name: Build and deploy
        run: |
          docker rm -f mcp-libre 2>/dev/null || true
          docker compose up -d --build

      - name: Verify health
        run: |
          sleep 5
          curl -sf http://127.0.0.1:8765/health || exit 1
